# Rime schema settings
# encoding: utf-8

schema:
  schema_id: yuce
  name: "亂打輸入法"
  version: "1.4"
  author:
    - "Custom Transformer IME"
  description: |
    結合 Transformer 按鍵誤觸糾錯模型的「亂打輸入法」注音輸入法
    字根補齊（≥2 鍵即預測）；組字區顯示注音；Shift 切英文；Enter 選字

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    states: [ 半角, 全角 ]

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: inline_ascii
    Caps_Lock: clear
    Control_L: noop
    Control_R: noop

engine:
  processors:
    - ascii_composer
    - lua_processor@*yuce_space
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*yuce_translator
  filters:
    - uniquifier

menu:
  page_size: 9

speller:
  # 大千 41 鍵；'_'＝一聲（空白鍵映射）；英文模式可含真實空白
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-6347_ "
  initials: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-"
  auto_select: false
